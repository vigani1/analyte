[package]
name = "analyte-sink"
description = "Delivery to lab apps through the outbox, and polling the app for orders."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
test-hooks = []

[dependencies]
analyte-config = { workspace = true }
analyte-store = { workspace = true }
analyte-contract = { workspace = true }
analyte-model = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros"] }
thiserror = { workspace = true }
tracing = { workspace = true }
jiff = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }


[dev-dependencies]
axum.workspace = true
analyte-fixtures.workspace = true
analyte-receiver = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "test-util", "process"] }


[lints]
workspace = true
