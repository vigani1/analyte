serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
jiff = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
analyte-fixtures.workspace = true
analyte-receiver = { workspace = true }
axum = { workspace = true }
