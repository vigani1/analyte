[package]
name = "analyte-app"
description = "The Analyte desktop app: a window on the engine's admin pages and a tray icon with its state (Windows)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "analyte-app"
path = "src/main.rs"

[dependencies]
analyte-i18n = { workspace = true }
askama = { workspace = true }
jiff = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "process", "net"] }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[target.'cfg(windows)'.dependencies]
tauri = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-notification = { workspace = true }
tracing-subscriber = { workspace = true }
windows-registry = { workspace = true }
# ADR 0022: the native maximize button and Alt+Space (`shell/frame.rs`).
webview2-com = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
tauri-build = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
# Tauri's mock runtime, to prove which webview may run which window command.
tauri = { workspace = true, features = ["test"] }

[dev-dependencies]
axum = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util"] }

[lints]
workspace = true
