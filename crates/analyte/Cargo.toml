[package]
name = "analyte"
description = "The Analyte program: the service that connects lab analyzers to lab apps, and its command line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
test-hooks = []

[dependencies]
analyte-poct = { workspace = true }
analyte-vidas = { workspace = true }
analyte-autolyser = { workspace = true }
quick-xml = { workspace = true }
serde_json = { workspace = true }
analyte-sink = { workspace = true }
thiserror = { workspace = true }
serialport = { workspace = true }
fs4 = { workspace = true }
analyte-model = { workspace = true }
analyte-store = { workspace = true }
analyte-transport = { workspace = true }
analyte-framing = { workspace = true }
analyte-dialog = { workspace = true }
analyte-config = { workspace = true }
analyte-astm = { workspace = true }
analyte-hl7 = { workspace = true }
analyte-mapping = { workspace = true }
analyte-contract = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time", "io-util"] }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
jiff = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
analyte-sim = { workspace = true }
analyte-receiver = { workspace = true }
axum = { workspace = true }
rusqlite = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-services = { workspace = true }
