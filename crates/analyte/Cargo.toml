[package]
autotests = false
name = "analyte"
description = "The Analyte program: the service that connects lab analyzers to lab apps, and its command line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
test-hooks = ["analyte-sink/test-hooks"]

[dependencies]
askama = { workspace = true }
futures-core = { workspace = true }
axum = { workspace = true, features = ["form"] }
getrandom = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
analyte-poct = { workspace = true }
analyte-vidas = { workspace = true }
analyte-autolyser = { workspace = true }
quick-xml = { workspace = true }
serde_json = { workspace = true }
analyte-sink = { workspace = true }
thiserror = { workspace = true }
fs4 = { workspace = true }
if-addrs = { workspace = true }
analyte-model = { workspace = true }
analyte-store = { workspace = true }
analyte-transport = { workspace = true }
analyte-framing = { workspace = true }
analyte-dialog = { workspace = true }
analyte-config = { workspace = true }
analyte-astm = { workspace = true }
analyte-hl7 = { workspace = true }
analyte-mapping = { workspace = true }
analyte-contract = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time", "io-util"] }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
jiff = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
rpassword = { workspace = true }

[dev-dependencies]
analyte-fixtures.workspace = true
tokio = { workspace = true, features = ["process", "test-util"] }
analyte-sim = { workspace = true }
analyte-receiver = { workspace = true }
rusqlite = { workspace = true }
tempfile = { workspace = true }

[build-dependencies]
embed-resource = { workspace = true }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-services = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading"] }

[[test]]
name = "admin_token"
path = "tests/admin_token.rs"

[[test]]
name = "delivery"
required-features = ["test-hooks"]
path = "tests/delivery/mod.rs"

[[test]]
name = "receive"
required-features = ["test-hooks"]
path = "tests/receive/mod.rs"

[[test]]
name = "packaging"
path = "tests/packaging.rs"

[[test]]
name = "program_file"
path = "tests/program_file.rs"

[[test]]
name = "chunk_receive"
required-features = ["test-hooks"]
path = "tests/chunk_receive/mod.rs"


[[test]]
name = "orders"
required-features = ["test-hooks"]
path = "tests/orders/mod.rs"

[[test]]
name = "service"
required-features = ["test-hooks"]
path = "tests/service/mod.rs"

[[test]]
name = "law"
required-features = ["test-hooks"]
path = "tests/law/mod.rs"
