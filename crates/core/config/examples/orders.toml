# Synthetic opt-in section appended to the ASTM teaching definition.
[orders]
send_ahead = true
priorities = [{app="routine",machine="R"}]
[orders.query]
deadline_ms = 1000
when_untrusted = "error"
[orders.astm]
specimen = {group="order",record="O",field=3,component=1,repetition=1}
# Order tests in mappings.test_system go out in component 4: ^^^CODE.
test = {group="order",record="O",field=5,component=4,repetition=1}
priority = {group="order",record="O",field=6,component=1,repetition=1}
action = {group="order",record="O",field=12,component=1,repetition=1}
action_code = "N"
