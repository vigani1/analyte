# Synthetic LAW work policy to append to examples/law.toml; documented only.
[law.work]
application = "HOST"
facility = "LAB"
peer_application = "SYN"
peer_facility = "LAB"
specimen_namespace = "LAB"
container_namespace = "LAB"
specimen_role = "P"
specimen_system = "HL70487"

[orders]
# Set true to admit unsolicited LAB-28 on the current connection.
send_ahead = false
placer_namespace = "LAB"
tests = [{app={namespace="synthetic",value="TEST"},machine_components=["SYN","Synthetic","99LAB"]}]
priorities = [{app="routine",machine="R"}]
specimen_types = [{app={namespace="types",value="SERUM"},machine="SER"}]
