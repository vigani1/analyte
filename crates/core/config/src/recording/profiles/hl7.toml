# Capture profile for HL7 v2 over MLLP (ADR 0034), shipped with Analyte, the
# same for every lab. Only the rules that keep an analyzer talking while
# Analyte records: MLLP Release 1 blocks and the HL7 acknowledgment. Results
# are kept as received and never read.
protocol = "hl7"
# Analyte's bound on one transport read or write (AGENTS rule 7).
operation_timeout_ms = 10000
# The capture dialog uses original-mode ACKs (HL7 2.3.1 2.12.1.2.1).
# Payload text and its encoding are kept as sent.
# HL7 2.5.1 2.7 (2.3.1 2.7): every segment ends with a carriage return.
terminator = "cr"
# How long Analyte may take to answer one message (stored first, then the
# acknowledgment), an Analyte bound (AGENTS rule 7).
wait_ms = 30000
# Analyte's bounds on one message (AGENTS rule 7), not from the standard.
message_bytes = 1048576
segments = 4096
fields = 256
repetitions = 256
