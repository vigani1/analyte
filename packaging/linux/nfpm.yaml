# Builds the Linux .deb and .rpm with nfpm 2.48.0 (pinned in the release workflow).
# ANALYTE_VERSION is the release version without "v". Run nfpm from the staged
# release folder (analyte, machines, packaging/linux, LICENSE, README.md).
# Paths here must agree with analyte.service; crates/analyte/tests/packaging.rs checks it.
name: analyte
arch: amd64
platform: linux
version: ${ANALYTE_VERSION}
version_schema: semver
release: "1"
section: misc
priority: optional
maintainer: Analyte maintainers
description: |-
  Bridge between clinical lab analyzers and lab apps.
  Receives, stores and delivers analyzer results faithfully and answers
  analyzer queries from orders the lab app gave it. Runs as a systemd service.
vendor: Analyte
homepage: https://github.com/vigani1/analyte
license: Apache-2.0

overrides:
  deb:
    depends:
      - systemd
      - passwd
  rpm:
    depends:
      - systemd
      - shadow-utils
      - util-linux

contents:
  - src: ./analyte
    dst: /usr/bin/analyte
    file_info:
      mode: 0755
  - src: ./packaging/linux/analyte.service
    dst: /usr/lib/systemd/system/analyte.service
    file_info:
      mode: 0644
  # Shipped machine definitions; the setup page lists them beside the program file.
  - src: ./machines
    dst: /usr/share/analyte/machines
    type: tree
  - src: /usr/share/analyte/machines
    dst: /etc/analyte/machines
    type: symlink
  # The service writes the configuration folder (setup page); data stays private.
  - dst: /etc/analyte
    type: dir
    file_info:
      mode: 0770
      owner: root
      group: analyte
  - dst: /var/lib/analyte
    type: dir
    file_info:
      mode: 0700
      owner: analyte
      group: analyte
  # Starter configuration: installed once, never replaced on upgrade.
  - src: ./packaging/linux/starter/analyte.toml
    dst: /etc/analyte/analyte.toml
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: analyte
  - src: ./packaging/linux/starter/machine-1.site.toml
    dst: /etc/analyte/machine-1.site.toml
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: analyte
  - src: ./LICENSE
    dst: /usr/share/doc/analyte/copyright
    file_info:
      mode: 0644
  - src: ./packaging/linux/README.md
    dst: /usr/share/doc/analyte/README.md
    file_info:
      mode: 0644

scripts:
  preinstall: ./packaging/linux/scripts/preinstall.sh
  postinstall: ./packaging/linux/scripts/postinstall.sh
  preremove: ./packaging/linux/scripts/preremove.sh
  postremove: ./packaging/linux/scripts/postremove.sh
