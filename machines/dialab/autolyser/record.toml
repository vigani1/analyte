# Dialab Autolyser: how it talks, for a record-only connection (ADR 0034).
# Only the protocol and the link; the rest comes from Analyte's shipped
# Autolyser capture profile and the lab's answers (poll interval, controls).
# Not a machine definition: nothing is read or delivered; only the next
# report is ever asked for.
recording_schema_version = 1
protocol = "autolyser"
[transport]
# Operator's Manual Rev18 chapter 23: serial from its PC, host polls. The
# manual does not establish the installed serial values, so the lab chooses
# all five on the analyzer's Utility / Setup Analyzer / Serial screen.
kind = "serial"
