# BioCARE Biolyte 2000: how it talks, for a record-only connection (ADR 0034).
# Only the protocol and the link; the rest comes from Analyte's shipped ASTM
# capture profile. Not a machine definition: nothing is read or delivered.
recording_schema_version = 1
protocol = "astm"
[transport]
# Service Manual 4.2A, Appendix VI: RS-232 DB25, ASTM, results only.
kind = "serial"
# Appendix VI gives 9600 baud, 8 data bits, no parity, one stop bit. Flow
# control is unverified, so the lab chooses it.
[transport.serial]
baud = 9600
data_bits = 8
parity = "none"
stop_bits = 1
