# bioMérieux VIDAS (from the VIDAS PC): how it talks, for a record-only
# connection (ADR 0034). Only the protocol and the link; the rest comes from
# Analyte's shipped VIDAS capture profile and the lab's answer to Literal or
# Alternate. Not a machine definition: nothing is read, delivered or downloaded.
recording_schema_version = 1
protocol = "vidas"
[transport]
# BCI Link guide 161150-486 A 3-8: serial from the VIDAS PC.
kind = "serial"
# A 3-8 defaults: 9600 baud, 8 data bits, no parity, one stop bit; the guides
# do not settle flow control, so the lab chooses it.
[transport.serial]
baud = 9600
data_bits = 8
parity = "none"
stop_bits = 1
