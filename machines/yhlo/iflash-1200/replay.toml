# Site answers for replaying each recording through machine.toml.
["barcode-query.rec.jsonl".choices]
communication_type = "one-way"
software_version = "other"

# ADR 0010: a held upload gets AA and keeps its interpretation with no delivery.
["malformed.rec.jsonl"]
interpretation = { receipts = 1, results = 0, deliveries = 0 }
["malformed.rec.jsonl".choices]
communication_type = "one-way"
software_version = "v1-01-10-01-10"

["qualitative.rec.jsonl"]
interpretation = { receipts = 1, results = 1, deliveries = 0 }
["qualitative.rec.jsonl".choices]
communication_type = "one-way"
