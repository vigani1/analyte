# HIM v2.3 §4, Tables 4–5. Orders and query replies require site evidence,
# including acceptance and installed deadlines. No outbound orders are configured.
[evidence]
level = "documented"

[[evidence.capabilities]]
model = "roche/cobas-e411"
# Wire communication-program token, shared by the two HIM revisions.
firmware = "1"
driver = "0.1.0"
config_digest = "untested"
transport = "serial"
dialogs = ["cobas-packed-result-upload", "cobas-qc-upload", "cobas-rerun", "cobas-query-with-orders-disabled", "cobas-synthetic-query-reply"]
failure_cases = ["bad-checksum-retry", "unresolved-measurement-identity", "query-with-orders-disabled", "query-error-and-cancellation"]
platform = "untested"
evidence_files = [
    "recordings/cobas-broken-checksum.rec.jsonl",
    "recordings/cobas-qc.rec.jsonl",
    "recordings/cobas-query-refusal.rec.jsonl",
    "recordings/cobas-query-reply.rec.jsonl",
    "recordings/cobas-rerun.rec.jsonl",
    "recordings/cobas-upload.rec.jsonl",
]

[[evidence.capabilities]]
