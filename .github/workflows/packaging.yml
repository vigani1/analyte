name: Packaging

# Builds the installers on pull requests that touch packaging, so breakage shows
# before a release, then installs, upgrades and removes them on the runner.
# Not a required check. Builds a debug program; releases use release.yml.
on:
  pull_request:
    paths:
      - 'packaging/**'
      - 'machines/**'
      - 'crates/analyte/tests/packaging.rs'
      - 'crates/app/**'
      - '.github/workflows/packaging.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked -p analyte -p analyte-app
      - name: Build archive and installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$' | Select-Object -First 1).Matches.Groups[1].Value
          ./packaging/build.ps1 -Platform windows -Target x86_64-pc-windows-msvc -Version $version -Binary target/debug/analyte.exe -App target/debug/analyte-app.exe
      - name: Install, check the setup page, upgrade and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist/*-setup.exe).FullName
          $root = "$env:ProgramData\Analyte"
          $logs = "$env:RUNNER_TEMP\analyte-logs"
          $null = New-Item -ItemType Directory -Force -Path $logs
          $run = 0
          function Install-Analyte {
            $script:run++
            $log = "$logs\setup-$($script:run).log"
            $process = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log" -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              Get-Content -LiteralPath $log -Tail 60 -ErrorAction SilentlyContinue
              throw "installer exit code $($process.ExitCode); see $log"
            }
            $service = Get-CimInstance Win32_Service -Filter "Name='Analyte'"
            if ($service.State -ne 'Running' -or $service.StartName -ne 'NT SERVICE\Analyte' -or $service.StartMode -ne 'Auto') {
              throw "service not running as configured: $($service.State) $($service.StartName) $($service.StartMode)"
            }
          }
          function Assert-SetupPage {
            $token = (Get-Content -LiteralPath "$root\data\admin-token" -Raw).Trim()
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $page = Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:8080/setup -Headers @{ Authorization = "Bearer $token" }
                # One table row names machine-1 and says it is not set up; cell markup may change.
                if ($page.Content -match '(?s)<tr[^>]*>(?:(?!</tr>).)*>machine-1<(?:(?!</tr>).)*Not set up yet') { return }
              } catch { Write-Output "waiting for the admin page: $($_.Exception.Message)" }
              Start-Sleep -Seconds 1
            }
            Get-Content -LiteralPath "$root\data\analyte.log" -Tail 50 -ErrorAction SilentlyContinue
            throw 'the setup page did not list machine-1 as not set up'
          }
          # ADR 0019: the desktop app beside the engine, told apart by name; the
          # same signing as the engine (none yet: both unsigned); its settings,
          # Start menu entry and sign-in entry; signed-in users may start the
          # service; /status answers without a key; the app reads it.
          function Assert-DesktopApp {
            $app = "$env:ProgramFiles\Analyte\analyte-app.exe"
            $engine = "$env:ProgramFiles\Analyte\analyte.exe"
            if (-not (Test-Path -LiteralPath $app)) { throw 'analyte-app.exe not installed' }
            if ((Get-Item $app).VersionInfo.FileDescription -ne 'Analyte') { throw 'the app is not described as Analyte' }
            if ((Get-Item $engine).VersionInfo.FileDescription -ne 'Analyte engine') { throw 'the engine is not described as Analyte engine' }
            $signed = (Get-AuthenticodeSignature -LiteralPath $app).Status
            if ($signed -ne (Get-AuthenticodeSignature -LiteralPath $engine).Status) { throw "app signature $signed differs from the engine's" }
            if ((Get-Content -LiteralPath "$env:ProgramFiles\Analyte\analyte-app.toml") -notcontains 'admin_port = 8080') { throw 'analyte-app.toml lacks the admin port' }
            if (-not (Test-Path -LiteralPath "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Analyte.lnk")) { throw 'Start menu entry missing' }
            $run = (Get-ItemProperty -LiteralPath 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name Analyte).Analyte
            if ($run -ne "`"$app`" --tray") { throw "sign-in entry is $run" }
            if (-not ((& sc.exe sdshow Analyte) -join '').Contains('(A;;RP;;;IU)')) { throw 'signed-in users may not start the service' }
            $status = Invoke-RestMethod -Uri http://127.0.0.1:8080/status
            if ($status.state -ne 'good' -or -not $status.version) { throw "status answered $($status | ConvertTo-Json -Compress)" }
            # The app in the tray only: it reads /status and logs the state it shows.
            $log = "$env:LOCALAPPDATA\Analyte\analyte-app.log"
            Remove-Item -LiteralPath $log -ErrorAction SilentlyContinue
            $process = Start-Process -FilePath $app -ArgumentList '--tray' -PassThru
            for ($i = 0; $i -lt 30 -and -not (Select-String -LiteralPath $log -SimpleMatch 'to=Running(Good)' -Quiet -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Seconds 1 }
            $seen = Select-String -LiteralPath $log -SimpleMatch 'to=Running(Good)' -Quiet -ErrorAction SilentlyContinue
            if ($process.HasExited) { throw "the app exited with code $($process.ExitCode)" }
            if (-not $seen) { Get-Content -LiteralPath $log -ErrorAction SilentlyContinue; throw 'the app did not show the engine as good' }
          }
          # ADR 0021 (Windows sign-in): setup makes the local group "Analyte
          # users" and adds the person who ran it. On the runner that is this
          # step's own account: it runs setup already elevated, so no UAC prompt
          # puts another account in between. Members are compared by SID.
          $installer = [Security.Principal.WindowsIdentity]::GetCurrent().User
          Write-Output "setup runs as $($installer.Translate([Security.Principal.NTAccount]).Value) ($($installer.Value))"
          function Get-SignInMembers {
            $group = Get-CimInstance Win32_Group -Filter "LocalAccount=True AND Name='Analyte users'"
            if (-not $group) { throw 'the local group Analyte users does not exist' }
            @(Get-CimAssociatedInstance -InputObject $group -Association Win32_GroupUser | ForEach-Object { $_.SID })
          }
          function Assert-ScriptSaid([string]$Log, [string]$Text) {
            if (-not (Select-String -LiteralPath $Log -SimpleMatch $Text -Quiet)) { throw "$Log lacks: $Text" }
          }
          Install-Analyte
          Assert-SetupPage
          Assert-DesktopApp
          if ((Get-SignInMembers) -notcontains $installer.Value) { throw 'setup did not add the installing user to Analyte users' }
          Assert-ScriptSaid "$logs\setup-1.log" "Local group 'Analyte users' created."
          # Someone else, added the way the user guide says, must survive the
          # upgrade and the uninstall.
          $other = 'analyte-ci-other'
          $password = 'Aa1!' + [guid]::NewGuid().ToString('N').Substring(0, 10)
          $null = & net.exe user $other $password /add
          if ($LASTEXITCODE -ne 0) { throw "net user exit code $LASTEXITCODE" }
          & net.exe localgroup 'Analyte users' $other /add
          if ($LASTEXITCODE -ne 0) { throw "net localgroup exit code $LASTEXITCODE" }
          $otherSid = (New-Object Security.Principal.NTAccount($other)).Translate([Security.Principal.SecurityIdentifier]).Value
          $rules = (Get-Acl -LiteralPath "$root\config").Access | Where-Object { $_.IdentityReference -eq 'NT SERVICE\Analyte' }
          if (-not ($rules.FileSystemRights -match 'Modify')) { throw 'the service cannot write the config folder' }
          if (-not (Get-Acl -LiteralPath "$root\config").AreAccessRulesProtected) { throw 'config folder inherits ProgramData permissions' }
          # An upgrade keeps the lab's configuration and the token.
          Add-Content -LiteralPath "$root\config\analyte.toml" -Value '# kept on upgrade'
          $token = (Get-FileHash -LiteralPath "$root\data\admin-token").Hash
          Install-Analyte
          Assert-SetupPage
          Assert-DesktopApp
          if (-not (Select-String -LiteralPath "$root\config\analyte.toml" -SimpleMatch '# kept on upgrade')) { throw 'upgrade replaced the configuration' }
          if ((Get-FileHash -LiteralPath "$root\data\admin-token").Hash -ne $token) { throw 'upgrade replaced the token' }
          # The upgrade finds the group and both members and changes nothing.
          $members = Get-SignInMembers
          if ($members -notcontains $installer.Value -or $members -notcontains $otherSid -or $members.Count -ne 2) { throw "upgrade changed Analyte users: $($members -join ', ')" }
          Assert-ScriptSaid "$logs\setup-2.log" "Local group 'Analyte users' already exists; its members were kept."
          Assert-ScriptSaid "$logs\setup-2.log" "is already in 'Analyte users'."
          # Uninstall removes the service and program, and keeps data and configuration.
          $process = Start-Process -FilePath "$env:ProgramFiles\Analyte\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$logs\uninstall.log" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "uninstaller exit code $($process.ExitCode)" }
          for ($i = 0; $i -lt 60 -and (Test-Path -LiteralPath "$env:ProgramFiles\Analyte\analyte.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Get-CimInstance Win32_Service -Filter "Name='Analyte'") { throw 'service still registered' }
          if (Test-Path -LiteralPath "$env:ProgramFiles\Analyte\analyte.exe") { throw 'program not removed' }
          # The app, its settings, its Start menu and sign-in entries go too; the
          # uninstaller closed the running app first.
          if (Get-Process analyte-app -ErrorAction SilentlyContinue) { throw 'the app still runs' }
          foreach ($gone in "$env:ProgramFiles\Analyte\analyte-app.exe", "$env:ProgramFiles\Analyte\analyte-app.toml", "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Analyte.lnk", "$env:LOCALAPPDATA\Analyte") {
            if (Test-Path -LiteralPath $gone) { throw "uninstall left $gone" }
          }
          if (Get-ItemProperty -LiteralPath 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name Analyte -ErrorAction SilentlyContinue) { throw 'sign-in entry left' }
          foreach ($kept in "$root\config\analyte.toml", "$root\data\analyte.db", "$root\data\admin-token") {
            if (-not (Test-Path -LiteralPath $kept)) { throw "uninstall removed $kept" }
          }
          # The group may list other people: uninstall keeps it and its members, and says so.
          $members = Get-SignInMembers
          if ($members -notcontains $installer.Value -or $members -notcontains $otherSid) { throw "uninstall changed Analyte users: $($members -join ', ')" }
          Assert-ScriptSaid "$logs\uninstall.log" "The local group 'Analyte users' was kept"
      # Synthetic runner data only: setup logs (script output, never the token),
      # the service log and the Service Control Manager's recent events.
      - name: Collect installer diagnostics
        if: failure()
        shell: pwsh
        run: |
          $logs = "$env:RUNNER_TEMP\analyte-logs"
          $null = New-Item -ItemType Directory -Force -Path $logs
          Copy-Item -LiteralPath "$env:ProgramData\Analyte\data\analyte.log" -Destination $logs -ErrorAction SilentlyContinue
          Get-WinEvent -FilterHashtable @{ LogName = 'System'; ProviderName = 'Service Control Manager' } -MaxEvents 50 -ErrorAction SilentlyContinue |
            Format-List TimeCreated, Id, LevelDisplayName, Message | Out-File "$logs\service-control-manager.txt"
          Get-ChildItem -LiteralPath $logs | Format-Table Name, Length
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: packaging-check-windows-logs
          path: ${{ runner.temp }}/analyte-logs/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaging-check-windows
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  linux:
    name: Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked -p analyte
      - name: Build archive, .deb and .rpm
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$' | Select-Object -First 1).Matches.Groups[1].Value
          ./packaging/build.ps1 -Platform linux -Target x86_64-unknown-linux-gnu -Version $version -Binary target/debug/analyte
      - name: Inspect package metadata
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          if command -v rpm >/dev/null; then rpm -qip dist/*.rpm; rpm -qlvp dist/*.rpm; fi
      - name: Install the .deb, check the setup page, upgrade, remove and purge
        run: |
          set -euo pipefail
          setup_page() {
            for _ in $(seq 60); do
              if curl -fsS -H "Authorization: Bearer $(sudo cat /var/lib/analyte/admin-token)" \
                  http://127.0.0.1:8080/setup | perl -0777 -ne 'exit(!m{<tr[^>]*>(?:(?!</tr>).)*>machine-1<(?:(?!</tr>).)*Not set up yet}s)'; then
                return 0
              fi
              sleep 1
            done
            sudo journalctl -u analyte.service --no-pager | tail -50
            return 1
          }
          sudo apt-get install -y "./$(ls dist/*.deb)"
          systemctl is-active analyte.service
          systemctl is-enabled analyte.service
          test "$(stat -c '%U:%G %a' /etc/analyte)" = 'root:analyte 770'
          test "$(sudo stat -c '%U:%G %a' /var/lib/analyte)" = 'analyte:analyte 700'
          test "$(sudo stat -c '%U %a' /var/lib/analyte/admin-token)" = 'analyte 600'
          setup_page
          # An upgrade keeps the lab's configuration and the token.
          echo '# kept on upgrade' | sudo tee -a /etc/analyte/analyte.toml >/dev/null
          token=$(sudo sha256sum /var/lib/analyte/admin-token)
          sudo dpkg -i --force-confold dist/*.deb
          sudo grep -q '# kept on upgrade' /etc/analyte/analyte.toml
          test "$(sudo sha256sum /var/lib/analyte/admin-token)" = "$token"
          setup_page
          # Removal stops the service and keeps configuration and data.
          sudo apt-get remove -y analyte
          if systemctl is-active --quiet analyte.service; then echo 'still running'; exit 1; fi
          sudo test -f /etc/analyte/analyte.toml
          sudo test -f /var/lib/analyte/analyte.db
          # A purge removes the configuration but never the clinical data.
          sudo apt-get purge -y analyte
          test ! -e /etc/analyte
          sudo test -f /var/lib/analyte/analyte.db
          sudo test -f /var/lib/analyte/admin-token
      - name: Install and remove the .rpm in a Fedora container
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:43 sh -euc '
            dnf install -y /dist/*.x86_64.rpm
            test "$(stat -c "%U:%G %a" /etc/analyte)" = "root:analyte 770"
            test "$(stat -c "%U %a" /var/lib/analyte/admin-token)" = "analyte 600"
            runuser -u analyte -- analyte check-config /etc/analyte/analyte.toml
            dnf remove -y analyte
            test -f /var/lib/analyte/admin-token
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaging-check-linux
          path: dist/*
          retention-days: 7
          if-no-files-found: error
