name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag against workspace version
        shell: python
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version']
          tag = os.environ['RELEASE_TAG']
          if tag != 'v' + version:
              raise SystemExit(f'Tag {tag!r} must equal workspace version v{version}')
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo doc --workspace --no-deps --all-features --locked
      - if: runner.os == 'Linux'
        run: rustup toolchain install 1.95 --profile minimal
      - if: runner.os == 'Linux'
        run: cargo +1.95 test --workspace --all-features --locked
      - if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            binary: analyte.exe
            # The desktop app (ADR 0019) is Windows only.
            app: -p analyte-app
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            binary: analyte
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add ${{ matrix.target }}
      - name: Refuse test hooks in release features
        shell: pwsh
        run: |
          $features = cargo tree --locked -p analyte --target ${{ matrix.target }} -e normal,build --depth 0 --format '{p} features=[{f}]'
          if ($LASTEXITCODE -ne 0) { throw 'Feature inspection failed' }
          if ($features -match 'test-hooks') { throw 'test-hooks must never ship' }
          Write-Output $features
      # Keep these flags identical to the feature inspection: no --all-features.
      - run: cargo build --release --locked -p analyte ${{ matrix.app }} --target ${{ matrix.target }}
      # Archive plus installers: the Windows installer (unsigned for now) or the
      # Linux .deb and .rpm. Tool versions and hashes are pinned in the script.
      - name: Package archive and installers
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          ./packaging/build.ps1 -Platform ${{ matrix.platform }} -Target ${{ matrix.target }}
          -Version ($env:RELEASE_TAG.Substring(1))
          -Binary 'target/${{ matrix.target }}/release/${{ matrix.binary }}'
          -App ($(if ('${{ matrix.platform }}' -eq 'windows') { 'target/${{ matrix.target }}/release/analyte-app.exe' } else { '' }))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      # Cargo's inventory avoids adding another supply-chain tool. Not an SBOM.
      - name: Record locked dependency inventory
        run: cargo metadata --locked --format-version 1 > dist/dependencies.json
      - name: Hash every release asset (except the checksum file itself)
        working-directory: dist
        run: sha256sum -- *.zip *.tar.gz *.exe *.deb *.rpm dependencies.json > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create draft for owner review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft \
            --title "Analyte $RELEASE_TAG" \
            --notes 'Owner review required before publication. See docs/release.md and CHANGELOG.md at this tag. The Windows installer is unsigned for now: SmartScreen warns; choose More info, then Run anyway. Evidence remains documented; these binaries are not real-machine qualification.'
