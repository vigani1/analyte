name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  layout:
    name: Layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/check-layout.sh

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - name: Text files are UTF-8 without BOM and use LF
        # Fuzz corpora contain deliberate wire CR bytes. Binary files are skipped (-I); a BOM or a carriage return fails the job.
        run: |
          bad=$(git ls-files -z -- . ':!fuzz/corpus/**' | LC_ALL=C xargs -0 grep -IlUP '\r|\A\xEF\xBB\xBF' || true)
          if [ -n "$bad" ]; then echo "$bad"; echo 'These files contain a BOM or CR line endings'; exit 1; fi
      - name: Text files are valid UTF-8
        # A builder saving with a Windows code page turns dashes, arrows and section
        # signs into invalid bytes or '?'. Binary files are skipped (-I).
        run: |
          bad=$(git ls-files -z -- . ':!fuzz/corpus/**' | LC_ALL=C.UTF-8 xargs -0 grep -IlaxvP '.*' || true)
          if [ -n "$bad" ]; then echo "$bad"; echo 'These files are not valid UTF-8'; exit 1; fi

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Production libraries exclude test hooks
        run: cargo clippy -p analyte -p analyte-sink --lib --no-default-features --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test-shard:
    name: Test shard (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.total }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows runs the suite in two halves on two machines; Linux is fast enough whole.
          - { os: ubuntu-latest, shard: 1, total: 1 }
          - { os: windows-latest, shard: 1, total: 2 }
          - { os: windows-latest, shard: 2, total: 2 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest@0.9.150
      # nextest runs test binaries in parallel, each test in its own process; the
      # partition gives each machine a fixed half of the tests.
      - run: cargo nextest run --workspace --all-features --locked --no-fail-fast --partition count:${{ matrix.shard }}/${{ matrix.total }}
      # Reuses the existing OS shards; only the two hook-bearing crates are rebuilt.
      - run: cargo nextest run -p analyte -p analyte-sink --no-default-features --locked --no-fail-fast --partition count:${{ matrix.shard }}/${{ matrix.total }}
      - if: matrix.shard == 1
        run: cargo test --doc --workspace --all-features --locked
      - if: matrix.shard == 1
        run: cargo doc --workspace --no-deps --all-features --locked

  test:
    # Keeps the required check names; fails unless every shard passed (a skipped
    # or cancelled shard is a failure, never a pass).
    name: Test (${{ matrix.os }})
    needs: test-shard
    if: always()
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test-shard.result }}" = success

  msrv:
    name: Minimum supported Rust (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest@0.9.150
      - run: cargo +1.95 nextest run --workspace --all-features --locked --no-fail-fast
      - run: cargo +1.95 test --doc --workspace --all-features --locked

  duplication:
    name: Duplication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Production code only; tests may repeat scenarios on purpose. Lower the
      # threshold as duplication is removed, never raise it to pass.
      - name: Production code duplication stays below 1.5%
        run: >-
          npx --yes jscpd@5.4.2 --format rust --min-lines 8 --min-tokens 70
          --ignore "**/target/**,**/fuzz/corpus/**,**/tests/**,**/tests.rs,**/*_tests.rs"
          --threshold 1.5 --reporters console crates

  deny:
    name: Licenses, sources and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lis01, mllp, lis02, hl7, law, poct, vidas, autolyser, recording, contract]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly-2026-10-31 --profile minimal
      - run: cargo +nightly-2026-10-31 install cargo-fuzz --locked --version 0.13.2
      - run: cargo +nightly-2026-10-31 fuzz run ${{ matrix.target }} -- -max_total_time=60 -timeout=10 -rss_limit_mb=1024 -max_len=2097152
