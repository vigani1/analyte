[workspace]
resolver = "3"
members = ["crates/analyte", "crates/app", "crates/steps/*", "crates/protocols/*", "crates/core/*", "crates/testing/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/vigani1/analyte"
publish = false

# One place for every shared version. Crates opt in with `name = { workspace = true }`
# and add only the features they need. Adding an entry here is a reviewed change.
[workspace.dependencies]
# Analyte crates
analyte-model = { path = "crates/core/model", version = "0.1.0" }
analyte-store = { path = "crates/core/store", version = "0.1.0" }
analyte-transport = { path = "crates/steps/transport", version = "0.1.0" }
analyte-framing = { path = "crates/steps/framing", version = "0.1.0" }
analyte-dialog = { path = "crates/steps/dialog", version = "0.1.0" }
analyte-astm = { path = "crates/protocols/astm", version = "0.1.0" }
analyte-hl7 = { path = "crates/protocols/hl7", version = "0.1.0" }
analyte-config = { path = "crates/core/config", version = "0.1.0" }
analyte-mapping = { path = "crates/steps/mapping", version = "0.1.0" }
analyte-contract = { path = "crates/core/contract", version = "0.1.0" }
analyte-sink = { path = "crates/steps/sink", version = "0.1.0" }
analyte-sim = { path = "crates/testing/sim", version = "0.1.0" }
analyte-receiver = { path = "crates/testing/receiver", version = "0.1.0" }
analyte-poct = { path = "crates/protocols/poct", version = "0.1.0" }
analyte-vidas = { path = "crates/protocols/vidas", version = "0.1.0" }
analyte-autolyser = { path = "crates/protocols/autolyser", version = "0.1.0" }

# Runtime, errors, logging
windows-services = { version = "0.100.0", default-features = false }
# Build-time only: compiles the app icon into analyte.exe on Windows (owner-approved 2026-11-19).
embed-resource = { version = "3.0.12", default-features = false }
# ADR 0017: access-list FFI for the protected data directory; matches Cargo.lock.
windows-sys = { version = "0.61.2", default-features = false }
tokio = { version = "1.54", default-features = false }
thiserror = "2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "std"] }

# Data formats
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2"
quick-xml = { version = "0.42", default-features = false } # POCT01-A2 XML; never resolves external entities
uuid = { version = "1.29", features = ["v7"] }
jiff = "0.2.45"

# Storage and I/O
rusqlite = { version = "0.42", features = ["bundled"] }
serialport = { version = "4.10", default-features = false }
fs4 = { version = "1.1", default-features = false } # free disk space via the OS API (statvfs / GetDiskFreeSpaceExW)

# HTTP and signing (ADR 0008)
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
url = "2.5.8" # the URL type reqwest re-exports; lets config parse URLs without the HTTP stack
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
subtle = "2.6"
getrandom = { version = "=0.4.3", default-features = false } # admin token OS entropy

# Admin pages (ADR 0018): compiled HTML templates, escaping on by default
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
# The `Stream` trait axum's server-sent events take (owner-approved 2026-11-20,
# PR c); already in the tree through axum, matches Cargo.lock.
futures-core = { version = "0.3.34", default-features = false }

# Desktop app (ADR 0019, owner-approved 2026-11-20): Tauri 2 and its official plugins, Windows only.
# Pinned exactly: the window's title bar and pages are two webviews in one
# window, and that multi-webview API is behind Tauri's `unstable` feature
# (ADR 0019). An upgrade re-checks it; `crates/app` has a test that fails
# until the pinned versions are reviewed.
tauri = { version = "=2.12.7", default-features = false, features = ["wry", "common-controls-v6", "tray-icon", "image-png", "unstable"] }
tauri-build = { version = "2.7.6", default-features = false }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-opener = { version = "2.7.3", default-features = false }
tauri-plugin-notification = "2.8.1"
# The current user's Run entry for "Start at sign-in", with a quoted path (the
# autostart plugin writes it unquoted). Same windows-rs project as windows-sys.
windows-registry = { version = "0.6.1", default-features = false }

# Command line
clap = { version = "4.6", features = ["derive"] }

# Tests only
analyte-fixtures = { path = "crates/testing/fixtures", version = "0.1.0" }
proptest = "1.12"
tempfile = "3.27"

[workspace.lints.rust]
# Deny, not forbid, so ADR 0017 can expect it in one module; crate roots still forbid it.
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
items_after_statements = "warn"
module_name_repetitions = "warn"
similar_names = "warn"

# Selected pedantic lints (AGENTS.md: no blanket groups).
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
doc_markdown = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
match_wildcard_for_single_variants = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
wildcard_enum_match_arm = "warn"
# Untrusted bytes: no unchecked arithmetic or indexing, no panics.
arithmetic_side_effects = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"

[profile.dev]
# Line tables keep file:line in backtraces and panics at a fraction of the size
# of full debug info; every worktree builds its own target folder.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies are not debugged here; dropping their debug info shrinks builds.
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
# Preserve unwinding: supervised owners join workers and report task panics.
panic = "unwind"
