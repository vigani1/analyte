[package]
name = "analyte-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "=0.4.13"
analyte-dialog = { path = "../crates/dialog" }
analyte-framing = { path = "../crates/framing" }
analyte-astm = { path = "../crates/astm" }
analyte-hl7 = { path = "../crates/hl7" }
analyte-poct = { path = "../crates/poct" }
analyte-vidas = { path = "../crates/vidas" }
analyte-autolyser = { path = "../crates/autolyser" }
analyte-transport = { path = "../crates/transport" }
analyte-contract = { path = "../crates/contract" }

[[bin]]
name = "lis01"
